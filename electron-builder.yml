# Packaging.
appId: dev.oxytocin.app
productName: Oxytocin
copyright: Copyright © 2026 Jakub Konkol
directories:
  output: release
  buildResources: resources/build
files:
  - out/**
  - package.json
  # Renderer and plugin libraries are bundled by Vite/esbuild; only modules loaded at runtime by main and the hosts
  # (and their dependencies) ship in app.asar. Keep in sync with the externals of out/main (tests/smoke checks it).
  - '!node_modules/**'
  - node_modules/{zod,semver,node-pty,jsonc-parser,electron-log,ps-list}/**
  - node_modules/{detect-libc,is-extglob,is-glob,picomatch,node-addon-api}/**
  - node_modules/@xterm/{headless,addon-serialize}/**
  - node_modules/@parcel/watcher*/**
  # electron-updater and its dependencies (loaded only in packaged builds, M9-T2).
  - node_modules/{electron-updater,builder-util-runtime,fs-extra,graceful-fs,jsonfile,universalify}/**
  - node_modules/{js-yaml,argparse,lazy-val,lodash.escaperegexp,lodash.isequal,tiny-typed-emitter,debug,ms,sax}/**
  # Plugin installation from .zip archives (M9-T3).
  - node_modules/{yauzl,pend}/**
asar: true
asarUnpack:
  - '**/node_modules/node-pty/**'
  - '**/node_modules/@parcel/watcher*/**'
  - '**/node_modules/ps-list/vendor/**'
extraResources:
  - { from: resources/icons, to: icons }
  - { from: resources/shell-integration, to: shell-integration }
  - { from: LICENSE, to: LICENSE }
  - { from: THIRD_PARTY_NOTICES.md, to: THIRD_PARTY_NOTICES.md }
  # Built-in plugins (npm run build:plugins): manifest, bundles and checksums only.
  - from: plugins
    to: plugins
    filter:
      - '*/package.json'
      - '*/oxytocin-checksums.json'
      - '*/dist/**'
      - '*/README.md'
      - '*/LICENSE'
      - '*/icon.*'
npmRebuild: false
# Auto-update: electron-updater reads app-update.yml generated from
# this section; latest*.yml (beta*.yml for 1.2.0-beta.N versions) and the blockmaps are uploaded to the GitHub
# Release with the packages. The beta channel = GitHub pre-releases (falls back to latest*.yml for stable ones).
publish:
  provider: github
  owner: JakubKonkol
  repo: Oxytocin
  releaseType: draft
# Electron fuses, flipped before signing.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
  # Unsigned macOS builds need a fresh ad-hoc signature after the binary changed (Apple silicon).
  resetAdHocDarwinSignature: true
# Signing and notarization are switched on by the release workflow when the secrets exist (docs/RELEASING.md;
# scripts/signing-args.ts). Without them the packages are unsigned.
win:
  target: [nsis]
  icon: resources/build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/build/icon.ico
  uninstallerIcon: resources/build/icon.ico
mac:
  target: [dmg, zip]
  category: public.app-category.developer-tools
  icon: resources/build/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/build/entitlements.mac.plist
  entitlementsInherit: resources/build/entitlements.mac.plist
  notarize: false
linux:
  target: [AppImage, deb]
  category: Development
  # Required for the .deb package (otherwise read from the author email in package.json).
  maintainer: Jakub Konkol <jakub.konkol27@gmail.com>
  icon: resources/build/icon.png
