# Packaging (docs/plan/01-architecture.md §11, docs/plan/10-quality-testing-release.md §8).
appId: dev.oxytocin.app
productName: Oxytocin
copyright: Copyright © 2026 Jakub Konkol
directories:
  output: release
  buildResources: resources/build
files:
  - out/**
  - package.json
  # Renderer and plugin libraries are bundled by Vite/esbuild; only modules loaded at runtime by main and the hosts
  # (and their dependencies) ship in app.asar. Keep in sync with the externals of out/main (tests/smoke checks it).
  - '!node_modules/**'
  - node_modules/{zod,semver,node-pty,jsonc-parser,electron-log,ps-list}/**
  - node_modules/{detect-libc,is-extglob,is-glob,picomatch,node-addon-api}/**
  - node_modules/@xterm/{headless,addon-serialize}/**
  - node_modules/@parcel/watcher*/**
asar: true
asarUnpack:
  - '**/node_modules/node-pty/**'
  - '**/node_modules/@parcel/watcher*/**'
  - '**/node_modules/ps-list/vendor/**'
extraResources:
  - { from: resources/icons, to: icons }
  - { from: resources/shell-integration, to: shell-integration }
  - { from: LICENSE, to: LICENSE }
  - { from: THIRD_PARTY_NOTICES.md, to: THIRD_PARTY_NOTICES.md }
  # Built-in plugins (npm run build:plugins): manifest, bundles and checksums only.
  - from: plugins
    to: plugins
    filter:
      - '*/package.json'
      - '*/oxytocin-checksums.json'
      - '*/dist/**'
      - '*/README.md'
      - '*/LICENSE'
      - '*/icon.*'
npmRebuild: false
win:
  target: [nsis]
  icon: resources/build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/build/icon.ico
  uninstallerIcon: resources/build/icon.ico
mac:
  target: [dmg, zip]
  category: public.app-category.developer-tools
  icon: resources/build/icon.png
linux:
  target: [AppImage, deb]
  category: Development
  icon: resources/build/icon.png
