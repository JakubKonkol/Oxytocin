name: Release

# Tag v* → the full test suite (full-tests.yml), packages for Windows (NSIS), macOS and Linux with a packaged smoke
# test on each (package.yml), then a published GitHub Release with the changelog section. Windows is the primary
# platform: its tests gate its package, and its package gates the release. Linux and macOS are tested and packaged in
# parallel; their packages are attached when they succeed but never block the release (re-running their failed jobs
# later re-runs this release job, which adds them). Signed and notarized when the signing secrets exist
# (docs/RELEASING.md); unsigned otherwise. "Run workflow" on a branch runs everything except the release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests-windows:
    uses: ./.github/workflows/full-tests.yml
    with:
      platforms: windows

  tests-linux-macos:
    uses: ./.github/workflows/full-tests.yml
    with:
      platforms: linux-macos

  package-windows:
    needs: tests-windows
    uses: ./.github/workflows/package.yml
    secrets: inherit
    with:
      platforms: windows

  package-linux-macos:
    needs: tests-linux-macos
    uses: ./.github/workflows/package.yml
    secrets: inherit
    with:
      platforms: linux-macos

  release:
    needs: [package-windows, package-linux-macos]
    # Runs when the Windows package exists, whatever happened to Linux and macOS.
    if: >-
      !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.package-windows.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist-packages
          pattern: packages-*
          merge-multiple: true
      - name: Publish the GitHub Release with the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi
          awk -v v="$VERSION" '$0 ~ "^## \\[?"v"\\]?" {p=1; next} /^## / && p {exit} p' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::warning::CHANGELOG.md has no section for $VERSION"
            echo "Oxytocin $VERSION" > notes.md
          fi
          ls -la dist-packages
          # Pre-release versions (1.2.0-beta.1) are offered only on the beta update channel.
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
          # An existing release (created by hand, or by an earlier run of this workflow) gets the packages added or
          # replaced: re-running the Linux/macOS jobs after a failure completes the release.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist-packages/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist-packages/* $PRERELEASE --verify-tag \
              --title "Oxytocin $VERSION" --notes-file notes.md
          fi
