name: Full tests

# The complete suite per platform: typecheck, lint, unit and integration tests, then E2E (Windows and Linux; the
# app is not E2E-tested on macOS). Started by hand (Actions → Full tests → Run workflow) and called by release.yml,
# once per group of platforms so that each platform's tests gate only its own packages.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to test
        type: choice
        options: [all, windows, linux-macos]
        default: all
  workflow_call:
    inputs:
      platforms:
        description: all, windows or linux-macos
        type: string
        default: all
      ref:
        description: Commit to test (default the triggering one)
        type: string
        default: ''

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{ fromJSON(inputs.platforms == 'windows' && '["windows-latest"]'
          || inputs.platforms == 'linux-macos' && '["ubuntu-latest","macos-latest"]'
          || '["windows-latest","ubuntu-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      # Linux: node-pty 1.1.0 has no prebuild and compiles here (the runner has build-essential and python3).
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: License check (MIT-compatible dependencies only, ADR-020)
        run: npm run licenses:check
      - run: npx vitest run --project unit-node --project unit-web
      - name: Shells for the shell integration tests (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -q zsh fish
      - run: npx vitest run --project integration
      - name: Install system dependencies for Electron (Linux)
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium
      - name: E2E (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run e2e
      - name: E2E (Windows)
        if: runner.os == 'Windows'
        run: npm run e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: e2e-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v5
        if: always() && runner.os != 'macOS'
        with:
          name: perf-${{ matrix.os }}
          path: perf-results.json
          if-no-files-found: ignore
