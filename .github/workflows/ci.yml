name: CI

# Fast checks on every push to main and on pull requests, on Windows (the primary platform): typecheck, lint,
# license allowlist and unit tests. Integration and E2E tests on Windows, Linux and macOS live in full-tests.yml
# (started by hand and before every release by release.yml).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: License check (MIT-compatible dependencies only, ADR-020)
        run: npm run licenses:check
      - run: npx vitest run --project unit-node --project unit-web
